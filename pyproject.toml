[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-attribution"
version = "0.1.0"
description = "Deterministic attribution from explicitly recorded outreach outcomes"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ca = "channel_attribution.cli:main"

[tool.setuptools.packages.find]
include = ["channel_attribution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
